[project]
name = "taste-5"
version = "0.1.0"
description = "TASTE variant 5 — exemplar-driven: contrastive pairs + hone-episode distillation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "fastembed>=0.7",
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
serve = ["granian>=1.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
taste = "taste.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taste"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E501", "UP042"]  # UP042: StrEnum would change wire str()
